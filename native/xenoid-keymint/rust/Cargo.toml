# Cargo is used only to build the glue crate for Android with cargo-ndk; the
# reference implementation under ../.deps/keymint keeps its own Soong build.
# The kmr-* crates depend on each other with crates.io wildcard versions and
# rely on the containing workspace to redirect those to the pinned checkout.

[workspace]
resolver = "2"
members = ["teesim-km"]

[patch.crates-io]
kmr-common = { path = "../.deps/keymint/common" }
kmr-derive = { path = "../.deps/keymint/derive" }
kmr-wire = { path = "../.deps/keymint/wire" }
kmr-ta = { path = "../.deps/keymint/ta" }
kmr-crypto-boring = { path = "../.deps/keymint/boringssl" }

[profile.release]
panic = "unwind"
opt-level = "z"
lto = true
# Keep debug info (line tables) and symbols so a crash in the TA symbolicates to
# a Rust file:line in the tombstone. build.sh always builds --release; the
# shipped binary is stripped by scripts/build-keymint.sh.
strip = false
debug = true
