name: xenoid-ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: fresh-static-gates
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run canonical static DAG
        run: ./scripts/ci.sh --fresh > static-gates.json
      - name: Validate structured result
        run: |
          python3 - <<'PY'
          import json
          report = json.load(open("static-gates.json", encoding="utf-8"))
          assert report.get("schema") == "dev.xenoid.ci/v1"
          assert report.get("profile") == "static"
          assert report.get("fresh") is True
          assert report.get("ok") is True
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-gate-json
          path: static-gates.json
          if-no-files-found: error

  runner-availability:
    name: trusted-runner-availability
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      macos: ${{ steps.labels.outputs.macos }}
      linux: ${{ steps.labels.outputs.linux }}
      remote: ${{ steps.labels.outputs.remote }}
    steps:
      - id: labels
        name: Validate protected runner label arrays
        env:
          MACOS_LABELS: ${{ vars.XENOID_MACOS_ARM64_RUNS_ON_JSON }}
          LINUX_LABELS: ${{ vars.XENOID_LINUX_ARM64_RUNS_ON_JSON }}
          REMOTE_LABELS: ${{ vars.XENOID_REMOTE_ARM64_RUNS_ON_JSON }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          raw = {
              "macos": os.environ.get("MACOS_LABELS", ""),
              "linux": os.environ.get("LINUX_LABELS", ""),
              "remote": os.environ.get("REMOTE_LABELS", ""),
          }
          release = os.environ.get("REF_TYPE") == "tag"
          runtime = os.environ.get("EVENT_NAME") == "workflow_dispatch" or (
              os.environ.get("REF_NAME") == "main"
          )
          required = {"linux"} if release else set(raw) if runtime else set()
          errors = []
          values = {}
          for name, value in raw.items():
              try:
                  parsed = json.loads(value)
              except Exception:
                  parsed = None
              valid = (
                  isinstance(parsed, list)
                  and bool(parsed)
                  and all(isinstance(item, str) and item.strip() for item in parsed)
              )
              if name in required and not valid:
                  errors.append(f"{name}_arm64_runner_unavailable")
              values[name] = parsed if valid else ["xenoid-runner-unavailable"]
          if os.environ.get("EVENT_NAME") == "push" and runtime and os.environ.get("REF_PROTECTED") != "true":
              errors.append("protected_main_required")
          if release and os.environ.get("REF_PROTECTED") != "true":
              errors.append("protected_release_tag_required")
          evidence = {
              "schema": "dev.xenoid.runner-availability/v1",
              "ok": not errors,
              "required": sorted(required),
              "unavailable": sorted(errors),
          }
          Path("runner-availability.json").write_text(
              json.dumps(evidence, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as stream:
              for name in ("macos", "linux", "remote"):
                  stream.write(f"{name}={json.dumps(values[name], separators=(',', ':'))}\n")
          if errors:
              raise SystemExit("runner_matrix_unavailable")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runner-availability-json
          path: runner-availability.json
          if-no-files-found: error

  runtime-macos-arm64:
    name: runtime-apple-silicon
    needs: [static, runner-availability]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected)
    runs-on: ${{ fromJSON(needs.runner-availability.outputs.macos) }}
    environment: xenoid-runtime
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Fresh convergence and runtime gates
        run: ./scripts/ci.sh --runtime --fresh > runtime-macos-gates.json
      - name: Validate structured result
        run: python3 -c 'import json; r=json.load(open("runtime-macos-gates.json")); assert r.get("schema")=="dev.xenoid.ci/v1" and r.get("profile")=="runtime" and r.get("fresh") is True and r.get("ok") is True'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-macos-gate-json
          path: runtime-macos-gates.json
          if-no-files-found: error

  runtime-linux-arm64:
    name: runtime-linux-arm64
    needs: [static, runner-availability]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected)
    runs-on: ${{ fromJSON(needs.runner-availability.outputs.linux) }}
    environment: xenoid-runtime
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Fresh convergence and runtime gates
        run: ./scripts/ci.sh --runtime --fresh > runtime-linux-gates.json
      - name: Validate structured result
        run: python3 -c 'import json; r=json.load(open("runtime-linux-gates.json")); assert r.get("schema")=="dev.xenoid.ci/v1" and r.get("profile")=="runtime" and r.get("fresh") is True and r.get("ok") is True'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-linux-gate-json
          path: runtime-linux-gates.json
          if-no-files-found: error

  runtime-remote-arm64:
    name: runtime-remote-engine
    needs: [static, runner-availability]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected)
    runs-on: ${{ fromJSON(needs.runner-availability.outputs.remote) }}
    environment: xenoid-runtime
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Fresh convergence and remote-engine runtime gates
        run: ./scripts/ci.sh --runtime --fresh > runtime-remote-gates.json
      - name: Validate structured result
        run: python3 -c 'import json; r=json.load(open("runtime-remote-gates.json")); assert r.get("schema")=="dev.xenoid.ci/v1" and r.get("profile")=="runtime" and r.get("fresh") is True and r.get("ok") is True'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-remote-gate-json
          path: runtime-remote-gates.json
          if-no-files-found: error

  runtime-full-arm64:
    name: runtime-full-live-matrix
    needs: [runtime-linux-arm64, runner-availability]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected)
    runs-on: ${{ fromJSON(needs.runner-availability.outputs.linux) }}
    environment: xenoid-runtime
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Fresh exhaustive live gate matrix
        run: ./scripts/ci.sh --full --fresh > full-gates.json
      - name: Consume fresh full evidence observationally
        run: |
          ./xenoid doctor --full --require-runtime --out "$RUNNER_TEMP/doctor-full.json"
          python3 -c 'import json,os; r=json.load(open(os.environ["RUNNER_TEMP"]+"/doctor-full.json")); assert r.get("schema")=="dev.xenoid.doctor/v1" and r.get("ok") is True and r.get("complete") is True'
      - name: Validate structured full result
        run: python3 -c 'import json; r=json.load(open("full-gates.json")); assert r.get("schema")=="dev.xenoid.ci/v1" and r.get("profile")=="full" and r.get("fresh") is True and r.get("ok") is True'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-full-gate-json
          path: full-gates.json
          if-no-files-found: error

  release-linux-arm64:
    name: protected-release
    needs: [static, runner-availability]
    if: github.event_name == 'push' && github.ref_type == 'tag' && github.ref_protected
    runs-on: ${{ fromJSON(needs.runner-availability.outputs.linux) }}
    environment: xenoid-release
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce validated artifacts twice
        run: |
          ./xenoid build all --force > "$RUNNER_TEMP/build-all-first.json"
          ./xenoid build all --force > "$RUNNER_TEMP/build-all-second.json"
      - name: Package twice and mandatorily verify release
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          archive="$(SOURCE_DATE_EPOCH=0 ./scripts/package-release.sh "$VERSION")"
          ./scripts/verify-release.py "$archive" > "$RUNNER_TEMP/release-first.json"
          first_sha="$(python3 -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/release-first.json"))["archiveSha256"])')"
          archive="$(SOURCE_DATE_EPOCH=0 ./scripts/package-release.sh "$VERSION")"
          ./scripts/verify-release.py "$archive" > release-gates.json
          second_sha="$(python3 -c 'import json; print(json.load(open("release-gates.json"))["archiveSha256"])')"
          test "$first_sha" = "$second_sha"
      - name: Validate structured release result
        run: python3 -c 'import json; r=json.load(open("release-gates.json")); assert r.get("schema")=="dev.xenoid.release-verification/v1" and r.get("ok") is True and len(r.get("archiveSha256", ""))==64'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-gate-json
          path: release-gates.json
          if-no-files-found: error
